<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arena guest pages – design proofs of concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ---------- Arena theme tokens (copied from webapp/style/themes.scss) ---------- */
:root, [data-theme='light'] {
  color-scheme: light;
  --color-primary: #3885ca; --color-on-primary: #fff;
  --color-primary-container: color-mix(in srgb, var(--color-primary) 30%, #fff);
  --color-primary-container-low: color-mix(in srgb, var(--color-primary) 9%, #fff);
  --color-on-primary-container: color-mix(in srgb, var(--color-primary) 60%, #000);
  --color-secondary: #5b6b7d;
  --color-background: #f6f7f9; --color-on-background: #2f3138;
  --color-surface: #fff; --color-on-surface: #2f3138;
  --color-surface-variant: #e7e9ee; --color-on-surface-variant: #62666f;
  --color-outline: #d1d1dd;
  --color-error: #ed5b46; --color-error-container: #f7dfe3;
  --color-success: #84ac67; --color-success-container: #f0f2e7;
  --color-shadow: #2f3138;
}
[data-theme='dark'] {
  color-scheme: dark;
  --color-primary: #4a94d6; --color-on-primary: #fff;
  --color-primary-container: color-mix(in srgb, var(--color-primary) 30%, #1f2228);
  --color-primary-container-low: color-mix(in srgb, var(--color-primary) 9%, #1f2228);
  --color-on-primary-container: color-mix(in srgb, var(--color-primary) 60%, #fff);
  --color-secondary: #9aa8b8;
  --color-background: #16181d; --color-on-background: #e3e5ea;
  --color-surface: #1f2228; --color-on-surface: #e3e5ea;
  --color-surface-variant: #2d3139; --color-on-surface-variant: #a9aeb9;
  --color-outline: #3e434d;
  --color-error: #f07462; --color-error-container: #4d2a2a;
  --color-success: #93bb76; --color-success-container: #2b3526;
  --color-shadow: #000;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: 'Noto Sans', system-ui, sans-serif; font-size: 14px; background: #2a2d33; color: #e3e5ea; }

/* ---------- POC chrome (not part of the design) ---------- */
.poc-bar { display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; align-items: center; padding: .6rem 1rem; background: #1b1d22; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 10; }
.poc-bar h1 { font-size: .95rem; margin: 0 .5rem 0 0; font-weight: 600; }
.poc-group { display: flex; gap: .25rem; align-items: center; }
.poc-group span { opacity: .6; font-size: .75rem; margin-right: .25rem; text-transform: uppercase; letter-spacing: .05em; }
.poc-group button { font: inherit; font-size: .8rem; background: #2d3139; color: #e3e5ea; border: 1px solid #3e434d; border-radius: 6px; padding: .3rem .6rem; cursor: pointer; }
.poc-group button.on { background: #2a6aa5; border-color: #2a6aa5; color: #fff; }
.poc-note { max-width: 1280px; margin: .75rem auto 0; padding: 0 1rem; font-size: .85rem; color: #a9aeb9; line-height: 1.5; }
.poc-stage { display: flex; justify-content: center; padding: 1rem; }
.frame { container-type: inline-size; width: 1280px; height: 800px; max-width: 100%; border-radius: 10px; overflow: hidden; position: relative; box-shadow: 0 10px 40px #0008; background: var(--color-background); color: var(--color-on-background); }
.frame.mobile { width: 390px; height: 844px; }

/* ---------- shared form primitives ---------- */
.f-title { font-size: 1.6rem; font-weight: 700; margin: 0; letter-spacing: -.01em; color: var(--color-on-surface); }
.f-sub { margin: .35rem 0 0; color: var(--color-on-surface-variant); line-height: 1.5; }
.f-form { display: grid; gap: 1rem; margin-top: 1.5rem; }
.f-field { display: grid; gap: .35rem; }
.f-label-row { display: flex; justify-content: space-between; align-items: baseline; }
.f-label { font-size: .8rem; font-weight: 600; color: var(--color-on-surface); }
.f-label .req { color: var(--color-error); }
.f-input { display: flex; align-items: center; gap: .5rem; height: 44px; padding: 0 .85rem; border: 1px solid var(--color-outline); border-radius: 8px; background: var(--color-surface); color: var(--color-on-surface); transition: border-color .15s, box-shadow .15s; }
.f-input.focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-primary) 25%, transparent); }
.f-input.invalid { border-color: var(--color-error); }
.f-input.ro { background: var(--color-surface-variant); color: var(--color-on-surface-variant); }
.f-input .ph { color: var(--color-on-surface-variant); opacity: .8; flex: 1; }
.f-input .val { flex: 1; }
.f-input .ico { width: 18px; height: 18px; color: var(--color-on-surface-variant); flex: none; }
.f-input textarea, .f-input.ta { height: 76px; align-items: flex-start; padding-top: .7rem; }
.f-help { font-size: .75rem; color: var(--color-on-surface-variant); }
.f-err { font-size: .75rem; color: var(--color-error); }
.f-link { color: var(--color-primary); font-weight: 600; text-decoration: none; font-size: .8rem; cursor: pointer; }
.f-link:hover { text-decoration: underline; }
.f-btn { height: 44px; border: 0; border-radius: 8px; font: inherit; font-weight: 600; font-size: .95rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: 0 1.25rem; }
.f-btn.primary { background: var(--color-primary); color: var(--color-on-primary); box-shadow: 0 1px 2px color-mix(in srgb, var(--color-shadow) 25%, transparent); }
.f-btn.primary:hover { background: color-mix(in srgb, var(--color-primary) 88%, #000); }
.f-btn.ghost { background: transparent; color: var(--color-on-surface); border: 1px solid var(--color-outline); }
.f-btn.block { width: 100%; }
.f-divider { display: flex; align-items: center; gap: .75rem; color: var(--color-on-surface-variant); font-size: .8rem; margin: .25rem 0; }
.f-divider::before, .f-divider::after { content: ''; height: 1px; flex: 1; background: var(--color-outline); }
.f-foot { text-align: center; font-size: .85rem; color: var(--color-on-surface-variant); }
.f-alert { display: block; padding: .7rem .85rem; border-radius: 8px; font-size: .85rem; line-height: 1.45; }
.f-alert.error { background: var(--color-error-container); color: var(--color-on-surface); border-left: 3px solid var(--color-error); }
.f-alert.info { background: var(--color-primary-container-low); color: var(--color-on-surface); border-left: 3px solid var(--color-primary); }
.f-alert.success { background: var(--color-success-container); color: var(--color-on-surface); border-left: 3px solid var(--color-success); }
.f-back { display: inline-flex; align-items: center; gap: .35rem; font-size: .85rem; color: var(--color-on-surface-variant); text-decoration: none; margin-bottom: 1.25rem; cursor: pointer; }
.f-back:hover { color: var(--color-on-surface); }
.otp { display: flex; gap: .5rem; justify-content: space-between; }
.otp div { width: 48px; height: 56px; border: 1px solid var(--color-outline); border-radius: 8px; display: grid; place-items: center; font-size: 1.4rem; font-weight: 600; background: var(--color-surface); color: var(--color-on-surface); }
.otp div.focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-primary) 25%, transparent); }
.badge-icon { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--color-primary-container-low); color: var(--color-primary); margin-bottom: 1rem; }
.badge-icon.ok { background: var(--color-success-container); color: var(--color-success); }
.badge-icon svg { width: 26px; height: 26px; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: .3rem .75rem; font-size: .75rem; color: var(--color-on-surface-variant); }
.checks div { display: flex; align-items: center; gap: .35rem; }
.checks div.ok { color: var(--color-success); }
.checks svg { width: 14px; height: 14px; }
.meter { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.meter i { height: 4px; border-radius: 2px; background: var(--color-outline); }
.meter i.on { background: var(--color-success); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.span2 { grid-column: 1 / -1; }
.steps { display: grid; gap: .9rem; margin: 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: .75rem; align-items: start; line-height: 1.45; }
.steps li::before { counter-increment: s; content: counter(s); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .8rem; background: var(--color-primary-container-low); color: var(--color-primary); }
.steps b { display: block; color: var(--color-on-surface); }
.steps span { color: var(--color-on-surface-variant); font-size: .85rem; }
.tpl { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
.tpl div { border: 1px solid var(--color-outline); border-radius: 8px; padding: .6rem .7rem; font-size: .8rem; background: var(--color-surface); color: var(--color-on-surface); cursor: pointer; }
.tpl div small { display: block; color: var(--color-on-surface-variant); font-size: .7rem; margin-top: .15rem; }
.tpl div.sel { border-color: var(--color-primary); box-shadow: inset 0 0 0 1px var(--color-primary); background: var(--color-primary-container-low); }
.captcha { display: flex; align-items: center; gap: .75rem; height: 64px; width: 300px; max-width: 100%; border: 1px solid var(--color-outline); border-radius: 4px; padding: 0 .85rem; background: var(--color-surface-variant); font-size: .85rem; color: var(--color-on-surface); }
.captcha i { width: 24px; height: 24px; border: 2px solid var(--color-on-surface-variant); border-radius: 3px; background: var(--color-surface); }

.toolbar { display: flex; gap: .25rem; align-items: center; }
.tb-btn { height: 34px; display: inline-flex; align-items: center; gap: .35rem; padding: 0 .6rem; border-radius: 8px; border: 1px solid transparent; background: transparent; color: inherit; font: inherit; font-size: .8rem; cursor: pointer; }
.tb-btn:hover { background: color-mix(in srgb, currentColor 10%, transparent); }
.tb-btn svg { width: 16px; height: 16px; }
.brand { display: flex; align-items: center; gap: .65rem; text-decoration: none; color: inherit; }
.brand img { width: 36px; height: 36px; }
.brand .wm { line-height: 1.05; }
.brand .wm small { display: block; font-size: .65rem; letter-spacing: .14em; text-transform: uppercase; opacity: .75; font-weight: 600; }
.brand .wm strong { font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; }

/* =====================================================================
   Direction A – Split screen (brand panel + form)
   ===================================================================== */
.A { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); height: 100%; }
.A-brand { position: relative; overflow: hidden; color: #fff; padding: 2.5rem 3rem; display: flex; flex-direction: column; justify-content: space-between; background: #1d3b2a url('not-logged-in-bg.jpg') center / cover; }
.A-brand::before { content: ''; position: absolute; inset: 0; background: linear-gradient(160deg, color-mix(in srgb, #15324a 88%, transparent) 0%, color-mix(in srgb, #1e4a2c 70%, transparent) 55%, color-mix(in srgb, #2b5d2f 45%, transparent) 100%); }
.A-brand > * { position: relative; }
.A-hero h2 { font-size: 2.3rem; line-height: 1.15; margin: 0 0 1rem; font-weight: 700; letter-spacing: -.02em; max-width: 26ch; }
.A-hero p { margin: 0 0 1.75rem; opacity: .85; line-height: 1.55; max-width: 46ch; font-size: .95rem; }
.A-feats { display: grid; gap: .75rem; margin: 0; padding: 0; list-style: none; }
.A-feats li { display: flex; gap: .7rem; align-items: center; font-size: .9rem; }
.A-feats li svg { width: 32px; height: 32px; padding: 7px; border-radius: 8px; background: #ffffff1f; flex: none; }
.A-brand .steps b { color: #fff; }
.A-brand .steps span { color: #ffffffcc; }
.A-brand .steps li::before { background: #2d4f4a; color: #fff; }
.A-legal { font-size: .75rem; opacity: .7; display: flex; gap: 1rem; flex-wrap: wrap; }
.A-legal a { color: inherit; }
.A-main { display: flex; flex-direction: column; background: var(--color-surface); overflow: auto; }
.A-top { display: flex; justify-content: flex-end; padding: 1rem 1.25rem; color: var(--color-on-surface-variant); }
.A-top .brand { display: none; margin-right: auto; color: var(--color-on-surface); }
.A-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 1rem 2rem 3rem; }
.A-col { width: 100%; max-width: 400px; }
.A-col.wide { max-width: 560px; }
@container (max-width: 760px) {
  .A { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .A-brand { padding: 1.25rem 1.25rem 1.5rem; }
  .A-brand .A-hero p, .A-brand .A-feats, .A-brand .A-legal { display: none; }
  .A-hero h2 { font-size: 1.25rem; margin: 1rem 0 0; }
  .A-body { align-items: flex-start; padding: 1rem 1.25rem 2rem; }
  .A-top { position: absolute; top: .9rem; right: .5rem; padding: 0; color: #fff; }
  .grid2, .tpl { grid-template-columns: 1fr; }
}

/* =====================================================================
   Direction B – Centered card on calm background
   ===================================================================== */
.B { height: 100%; display: flex; flex-direction: column; position: relative; overflow: auto; }
.B-bg { position: absolute; inset: 0; background: url('not-logged-in-bg.jpg') left top / cover; filter: saturate(.9); opacity: .35; }
[data-theme='dark'] .B-bg { opacity: .18; }
.B-bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to right, transparent 0%, var(--color-background) 85%); }
.B-top { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; color: var(--color-on-background); }
.B-body { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; padding: 1rem; }
.B-card { width: 100%; max-width: 420px; background: var(--color-surface); border: 1px solid var(--color-outline); border-radius: 16px; padding: 2.25rem 2.25rem 2rem; box-shadow: 0 20px 50px -20px color-mix(in srgb, var(--color-shadow) 35%, transparent); }
.B-card.wide { max-width: 760px; }
.B-card .logo { display: flex; justify-content: center; margin-bottom: 1.25rem; }
.B-card .logo img { width: 56px; height: 56px; }
.B-card .center { text-align: center; }
.B-foot { position: relative; text-align: center; padding: 1rem; font-size: .75rem; color: var(--color-on-surface-variant); display: flex; gap: 1.25rem; justify-content: center; }
.B-foot a { color: inherit; }
.B-ar { display: grid; grid-template-columns: 240px 1fr; gap: 2rem; }
@container (max-width: 760px) {
  .B-card { padding: 1.5rem 1.25rem; border-radius: 12px; }
  .B-top { padding: .5rem .75rem; }
  .B-ar, .grid2, .tpl { grid-template-columns: 1fr; }
}

/* =====================================================================
   Direction C – Brand gradient + illustrated "data flow" motif
   ===================================================================== */
.C { height: 100%; position: relative; overflow: auto; display: flex; flex-direction: column; color: #fff;
  background: radial-gradient(1200px 700px at 85% 110%, #6aa53f 0%, transparent 60%), radial-gradient(900px 600px at 0% 0%, #2f7fd0 0%, transparent 55%), linear-gradient(135deg, #12406b 0%, #1d5a5a 50%, #3c7a2f 100%); }
[data-theme='dark'] .C { background: radial-gradient(1200px 700px at 85% 110%, #3c6b22 0%, transparent 60%), radial-gradient(900px 600px at 0% 0%, #1a4f86 0%, transparent 55%), linear-gradient(135deg, #0b1f33 0%, #10302f 50%, #1d3a17 100%); }
.C-art { position: absolute; inset: 0; pointer-events: none; opacity: .55; }
.C-top { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 2rem; }
.C-body { position: relative; flex: 1; display: grid; grid-template-columns: 1fr 440px; gap: 3rem; align-items: center; padding: 1rem 4rem 3rem; }
.C-body.wide { grid-template-columns: 1fr 640px; align-items: start; }
.C-body.wide .C-pitch { position: sticky; top: 30vh; }
.C-pitch h2 { font-size: 2.6rem; line-height: 1.1; margin: 0 0 1rem; letter-spacing: -.02em; max-width: 16ch; }
.C-pitch p { opacity: .85; line-height: 1.6; max-width: 44ch; margin: 0 0 1.5rem; }
.C-chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.C-chips span { padding: .35rem .75rem; border-radius: 99px; background: #ffffff1c; border: 1px solid #ffffff30; font-size: .8rem; backdrop-filter: blur(4px); }
.C-card { background: color-mix(in srgb, var(--color-surface) 94%, transparent); color: var(--color-on-surface); backdrop-filter: blur(16px); border-radius: 20px; padding: 2.25rem; box-shadow: 0 30px 60px -25px #000a; border: 1px solid #ffffff40; max-height: 100%; }
.C-foot { position: relative; padding: 0 2rem 1rem; font-size: .75rem; opacity: .75; display: flex; gap: 1.25rem; }
.C-foot a { color: inherit; }
@container (max-width: 760px) {
  .C-body, .C-body.wide { grid-template-columns: 1fr; padding: .5rem 1rem 2rem; gap: 1.25rem; }
  .C-pitch p, .C-chips { display: none; }
  .C-pitch h2 { font-size: 1.5rem; }
  .C-top { padding: .75rem 1rem; }
  .C-card { padding: 1.5rem 1.25rem; }
  .C-foot { flex-wrap: wrap; justify-content: center; gap: .4rem 1rem; }
  .C-body.wide .C-pitch { position: static; }
  .grid2, .tpl { grid-template-columns: 1fr; }
}

/* =====================================================================
   "Current" – approximation of today's screen, for comparison only
   ===================================================================== */
.Z { height: 100%; position: relative; overflow: hidden; }
.Z-bg { position: absolute; inset: 0; background: url('not-logged-in-bg.jpg') center / cover; opacity: .2; }
.Z-tb { position: absolute; top: 0; left: 0; padding: .5rem 1rem; color: var(--color-on-background); }
.Z-banner { position: absolute; right: 5%; top: 0; width: 60px; padding: 10px; display: grid; gap: 10px; border: 2px solid var(--color-success); border-top: 0; }
.Z-banner div { text-align: center; color: #fff; text-transform: uppercase; font-size: 1.25rem; padding: 10px 0; line-height: 1.6; }
.Z-banner .of { background: color-mix(in srgb, var(--color-success) 90%, transparent); }
.Z-banner .ar { background: color-mix(in srgb, var(--color-error) 80%, transparent); }
.Z-form { position: absolute; left: 30%; top: 15%; width: 35%; display: grid; gap: 1rem; padding: 0 3rem; }
.Z-in { border: 1px solid var(--color-outline); border-radius: 4px; height: 56px; margin: 1rem; position: relative; display: grid; place-items: center; color: var(--color-on-surface-variant); background: var(--color-surface); }
.Z-in label { position: absolute; top: -9px; left: 10px; font-size: .75rem; background: var(--color-surface); padding: 0 4px; }
.Z-link { justify-self: center; font-weight: 600; font-size: .8rem; }
.Z-btns { display: flex; justify-content: space-between; align-items: center; }
.Z-btns button { width: 10rem; padding: 1rem; border: 0; text-transform: uppercase; font: inherit; font-weight: 600; background: color-mix(in srgb, var(--color-success) 50%, transparent); color: var(--color-on-surface); }
</style>
</head>
<body>
<div class="poc-bar">
  <h1>Arena · guest pages POC</h1>
  <div class="poc-group" id="g-dir"><span>Direction</span></div>
  <div class="poc-group" id="g-screen"><span>Screen</span></div>
  <div class="poc-group" id="g-theme"><span>Theme</span></div>
  <div class="poc-group" id="g-vp"><span>Viewport</span></div>
</div>
<p class="poc-note" id="note"></p>
<div class="poc-stage"><div class="frame" id="frame"></div></div>

<script>
/* ---------- icons (inline, stroke-based) ---------- */
const I = {
  mail: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  lock: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
  eye: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>',
  user: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg>',
  key: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m5 12 5 5 9-10"/></svg>',
  dot: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="3"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z"/></svg>',

/* data-flow line art inspired by the logo: curved streams that become a grid */
function artC() {
  let paths = ''
  for (let i = 0; i < 7; i++) {
    const y0 = 120 + i * 95, y1 = 300 + i * 38
    paths += `<path d="M-50 ${y0} C 350 ${y0}, 450 ${y1}, 820 ${y1}" stroke="#fff" stroke-opacity="${0.1 + (i % 3) * 0.05}" stroke-width="${14 - i}" fill="none" stroke-linecap="round"/>`
  }
  let cells = ''
  for (let r = 0; r < 7; r++) for (let c = 0; c < 6; c++) {
    const o = ((r * 7 + c * 3) % 5) / 18 + 0.06
    cells += `<rect x="${860 + c * 44}" y="${288 + r * 38}" width="32" height="26" rx="4" fill="#d8f5a2" fill-opacity="${o}"/>`
  }
  return `<svg class="C-art" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid slice">${paths}${cells}</svg>`
}

/* ---------- POC controls ---------- */
const state = Object.fromEntries(new URLSearchParams(location.search))
state.dir ??= 'A'; state.screen ??= 'login'; state.theme ??= 'light'; state.vp ??= 'desktop'

function buttons(groupId, options, key) {
  const g = document.getElementById(groupId)
  for (const [value, label] of options) {
    const b = document.createElement('button')
    b.textContent = label
    b.dataset.v = value
    b.onclick = () => { state[key] = value; render() }
    g.appendChild(b)
  }
}
buttons('g-dir', Object.entries(DIRECTIONS).map(([k, d]) => [k, d.label]), 'dir')
buttons('g-screen', Object.entries(SCREENS).map(([k, s]) => [k, s.label]), 'screen')
buttons('g-theme', [['light', 'Light'], ['dark', 'Dark']], 'theme')
buttons('g-vp', [['desktop', 'Desktop'], ['mobile', 'Mobile']], 'vp')

function render() {
  for (const [g, k] of [['g-dir', 'dir'], ['g-screen', 'screen'], ['g-theme', 'theme'], ['g-vp', 'vp']])
    for (const b of document.querySelectorAll(`#${g} button`)) b.classList.toggle('on', b.dataset.v === state[k])
  const frame = document.getElementById('frame')
  frame.dataset.theme = state.theme
  frame.className = `frame ${state.vp}`
  frame.innerHTML = DIRECTIONS[state.dir].render(state.screen)
  document.getElementById('note').innerHTML = DIRECTIONS[state.dir].note
  history.replaceState(null, '', `?${new URLSearchParams(state)}`)
}
