name: Deploy to development

on:
  push:
    branches:
      - 'master'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # fetch all tags, default 1
          persist-credentials: false # this job never pushes back to git, so don't leave a token in .git/config

      - uses: ./.github/actions/deploy-heroku
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME_DEVELOPMENT }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
