name: Run test

on:
  pull_request:

env:
  PGHOST: localhost
  PGPORT: 5444
  PGDATABASE: of-arena-test
  PGUSER: arena
  PGPASSWORD: arena
  # needed by the build job too: it's baked into the client bundle as EMAIL_FROM_RESOLVED (see webpack.config.mts)
  ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
  RATE_LIMIT_ENABLED: false
  # required by arena-server unless NODE_ENV is development or test: throwaway values for the CI server
  USER_AUTH_TOKEN_SECRET: ci-user-auth-token-secret
  USER_2FA_SECRET: ci-user-2fa-secret
  # throwaway key for the CI server: encrypts the client secrets of the login providers created by the e2e tests
  AUTH_PROVIDER_SECRET_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # arena and @openforis/arena-server must share the same @openforis/arena-core copy: services registered
      # by arena-server in the ServiceRegistry singleton are read by arena (a second copy has its own registry)
      - name: Check a single @openforis/arena-core version
        run: |
          versions=$(grep -E '^  resolution: "@openforis/arena-core@npm:' yarn.lock | sed -E 's/.*@npm:([^"]+)".*/\1/')
          count=$(echo "$versions" | grep -c .)
          if [ "$count" -ne 1 ]; then
            echo "::error::@openforis/arena-core must be resolved to a single version, found $count: $(echo $versions)." \
              "Align the @openforis/arena-core version range with the one required by @openforis/arena-server," \
              "then run: yarn dedupe @openforis/arena-core"
            exit 1
          fi
          echo "@openforis/arena-core resolved to a single version: $versions"
      - uses: ./.github/actions/setup
      - name: Build
        run: yarn build
      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 1

  # unit and integration tests exercise the code in-process against the DB directly - they never
  # talk to the built server over HTTP - so they don't need to wait on the `build` job at all.
  test-fast:
    runs-on: ubuntu-26.04
    name: Test (${{ matrix.suite }})
    permissions:
      contents: read
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            test-command: yarn test:unit
          - suite: integration
            test-command: yarn test:integration
    services:
      postgres:
        image: postgis/postgis:17-3.7
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: of-arena-test
        ports:
          - 5444:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Integration tests hit the DB directly and need the schema migrated first, which currently
      # only happens as a side effect of server startup (MIGRATE_ONLY is not read anywhere in
      # server/ or @openforis/arena-server, so `yarn server:migrate` boots the full server and
      # never exits - it can't be used as a one-shot migration step). Building just the server
      # (not the client) and booting it is enough, and much faster than the full `yarn build`
      # used for e2e/load.
      - name: Build server
        if: matrix.suite == 'integration'
        run: yarn build:server:dev
      - name: Run server (applies DB migrations on startup)
        if: matrix.suite == 'integration'
        run: |
          ln -s dist/server.js .
          node dist/server.js &
      - name: Wait for server to start
        if: matrix.suite == 'integration'
        run: while ! nc -z localhost 9090; do sleep 5; done;
      - name: Run tests
        run: ${{ matrix.test-command }}

  # the e2e tests run the dist build directly: check that the Docker image (only the runtime files) starts and serves the app
  docker-image:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
    services:
      postgres:
        image: postgis/postgis:17-3.7
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: of-arena-test
        ports:
          - 5444:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: arena:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container
        run: |
          docker run -d --name arena --network host \
            -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD -e ADMIN_EMAIL -e ADMIN_PASSWORD \
            -e SENDGRID_API_KEY -e RATE_LIMIT_ENABLED -e USER_AUTH_TOKEN_SECRET -e USER_2FA_SECRET \
            -e AUTH_PROVIDER_SECRET_ENCRYPTION_KEY \
            arena:ci
      - name: Check the app is served
        run: |
          timeout 300 bash -c 'until curl -fs -o /dev/null http://localhost:9090/app/home/; do sleep 5; done'
          for path in /app/home/ /img/map-layers-toggle.png /geo/natural-earth-equal-earth-eq2merc.geojson; do
            curl -fsSL -o /dev/null -w "%{http_code} $path\n" "http://localhost:9090$path"
          done
      - name: Container logs
        if: always()
        run: docker logs arena

  # e2e and load tests drive the running server over HTTP, so they need the production build
  # started with pm2 first.
  test-server:
    needs: build
    runs-on: ubuntu-26.04
    name: Test (${{ matrix.suite }})
    permissions:
      contents: read
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the e2e specs also prepare their data directly in the DB (PG* env variables)
          - suite: e2e
            test-command: yarn test:e2e
            playwright: true
          - suite: load
            load: true
    services:
      postgres:
        image: postgis/postgis:17-3.7
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: of-arena-test
        ports:
          - 5444:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install Playwright browsers
        if: matrix.playwright
        # use the Playwright CLI installed with the project dependencies (version locked by yarn.lock)
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Install pm2
        run: npm install -g --ignore-scripts pm2@7.0.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Generate the AI key encryption secret
        # random per run: the e2e specs save provider API keys, which the server encrypts with this secret
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "AI_USER_KEY_ENCRYPTION_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Run server
        # the mock AI provider lets the e2e specs exercise the AI features without a real provider
        env:
          AI_FEATURES_ENABLED: true
          AI_MOCK_PROVIDER_ENABLED: true
          AI_DEFAULT_PROVIDER: mock
          AI_DEFAULT_MODEL: mock
          # no daily budget for the mock provider: the specs make many calls with the same users
          AI_DEFAULT_DAILY_CALL_LIMIT: 0
          AI_DEFAULT_DAILY_CHAR_LIMIT: 0
          # the specs make many calls with the same users: no per-minute limit, no cap of provider calls in flight
          AI_RATE_LIMIT_PER_MINUTE: 0
          AI_PROVIDER_MAX_IN_FLIGHT_PER_USER: 0
        run: |
          ln -s dist/server.js .
          exec pm2-runtime server.js &
      - name: Wait for server to start
        run: while ! nc -z localhost 9090; do sleep 5; done;
      - name: Run tests
        if: ${{ !matrix.load }}
        env:
          E2E_AI_MOCK: true
        run: ${{ matrix.test-command }}
      - name: Run load-test unit tests
        if: matrix.load
        run: yarn test:load:unit
      - name: Build sample survey zip for stress test
        if: matrix.load
        run: yarn test:load:build-fixture /tmp/sample-survey.zip
      - name: Run survey import stress test
        if: matrix.load
        timeout-minutes: 20
        run: yarn test:load --zip /tmp/sample-survey.zip --job-timeout 600000
      - name: Upload Playwright report
        if: ${{ failure() && matrix.playwright }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            test/e2e/playwright-report
            test/e2e/test-results
          retention-days: 7
