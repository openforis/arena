name: Run test

on:
  pull_request:

env:
  PGHOST: localhost
  PGPORT: 5444
  PGDATABASE: of-arena-test
  PGUSER: arena
  PGPASSWORD: arena
  # needed by the build job too: it's baked into the client bundle as EMAIL_FROM_RESOLVED (see webpack.config.babel.js)
  ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
  RATE_LIMIT_ENABLED: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build
        run: yarn build
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 1

  # unit and integration tests exercise the code in-process against the DB directly - they never
  # talk to the built server over HTTP - so they don't need to wait on the `build` job at all.
  test-fast:
    runs-on: ubuntu-22.04
    name: Test (${{ matrix.suite }})
    permissions:
      contents: read
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            test-command: yarn test:unit
          - suite: integration
            test-command: yarn test:integration
    services:
      postgres:
        image: postgis/postgis:12-3.0
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: of-arena-test
        ports:
          - 5444:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Integration tests hit the DB directly and need the schema migrated first, which currently
      # only happens as a side effect of server startup (MIGRATE_ONLY is not read anywhere in
      # server/ or @openforis/arena-server, so `yarn server:migrate` boots the full server and
      # never exits - it can't be used as a one-shot migration step). Building just the server
      # (not the client) and booting it is enough, and much faster than the full `yarn build`
      # used for e2e/load.
      - name: Build server
        if: matrix.suite == 'integration'
        run: yarn build:server:dev
      - name: Run server (applies DB migrations on startup)
        if: matrix.suite == 'integration'
        run: |
          ln -s dist/server.js .
          node dist/server.js &
      - name: Wait for server to start
        if: matrix.suite == 'integration'
        run: while ! nc -z localhost 9090; do sleep 5; done;
      - name: Run tests
        run: ${{ matrix.test-command }}

  # e2e and load tests drive the running server over HTTP, so they need the production build
  # started with pm2 first.
  test-server:
    needs: build
    runs-on: ubuntu-22.04
    name: Test (${{ matrix.suite }})
    permissions:
      contents: read
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: e2e
            test-command: yarn test:e2e
            playwright: true
          # new isolated Playwright Test suite (test/e2e-playwright), run alongside the legacy one while migrating
          - suite: e2e-playwright
            test-command: yarn test:e2e:pw
            playwright: true
            playwright-report: true
          - suite: load
            load: true
    services:
      postgres:
        image: postgis/postgis:12-3.0
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: of-arena-test
        ports:
          - 5444:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install Playwright browsers
        if: matrix.playwright
        run: npx playwright install --with-deps
      - name: Install pm2
        run: npm install pm2 -g
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Run server
        run: |
          ln -s dist/server.js .
          exec pm2-runtime server.js &
      - name: Wait for server to start
        run: while ! nc -z localhost 9090; do sleep 5; done;
      - name: Run tests
        if: ${{ !matrix.load }}
        run: ${{ matrix.test-command }}
      - name: Run load-test unit tests
        if: matrix.load
        run: yarn test:load:unit
      - name: Build sample survey zip for stress test
        if: matrix.load
        run: yarn test:load:build-fixture /tmp/sample-survey.zip
      - name: Run survey import stress test
        if: matrix.load
        timeout-minutes: 20
        run: yarn test:load --zip /tmp/sample-survey.zip --job-timeout 600000
      - name: Upload Playwright report
        if: ${{ failure() && matrix.playwright-report }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            test/e2e-playwright/playwright-report
            test/e2e-playwright/test-results
          retention-days: 7
