apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace everything is deployed to (created if missing)
namespace: arena

labels:
  - pairs:
      app.kubernetes.io/part-of: arena

resources:
  - ../../base

components:
  - ../../components/postgres
  # - ../../components/rstudio

images:
  - name: openforis/arena
    newTag: v2.9.5

configMapGenerator:
  - name: arena-config
    envs:
      - config.env

# Copy the *.example files and fill them in: the copies are git-ignored.
secretGenerator:
  - name: arena-secrets
    envs:
      - secrets.env
  - name: arena-db-credentials
    envs:
      - db.env
  # RStudio only: basic auth users, created with "htpasswd -c rstudio.htpasswd <user>".
  # - name: arena-rstudio-auth
  #   files:
  #     - auth=rstudio.htpasswd
  #   options:
  #     disableNameSuffixHash: true

patches:
  # Public host name
  - target:
      kind: Ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: arena.example.org
      - op: replace
        path: /spec/tls/0/hosts/0
        value: arena.example.org
  # cert-manager ClusterIssuer
  - target:
      kind: Ingress
      name: arena
    patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-prod
