apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# One shared RStudio Server instance at /rstudio/ on the Arena host (see README for its limits).
# The overlay must also generate the arena-rstudio-auth Secret.
resources:
  - deployment.yaml
  - service.yaml
  - pvc.yaml
  - ingress.yaml

configMapGenerator:
  - name: arena-rstudio-config
    files:
      - disable_auth_rserver.conf
