apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arena-rstudio
  labels:
    app.kubernetes.io/name: arena-rstudio
  annotations:
    # Strips the /rstudio prefix; RStudio adds it back through www-root-path.
    nginx.ingress.kubernetes.io/use-regex: 'true'
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-body-size: 1024m
    # RStudio runs without its own authentication.
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: arena-rstudio-auth
    nginx.ingress.kubernetes.io/auth-realm: RStudio Server
spec:
  ingressClassName: nginx
  # Certificate issued for the arena Ingress.
  tls:
    - hosts:
        - arena.example.org
      secretName: arena-tls
  rules:
    - host: arena.example.org
      http:
        paths:
          - path: /rstudio(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: arena-rstudio
                port:
                  name: http
