services:

  db:
    image: "postgis/postgis:17-3.7"
    environment:
      # Must duplicate due to limitations of docker-compose:
      POSTGRES_DB: of-arena-dev
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d of-arena-dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  app_server:
    env_file:
      - ../../.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9990:9090"
    build:
      context: ../..
      dockerfile: Dockerfile
      target: arena

    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: of-arena-dev
      PGUSER: arena
      PGPASSWORD: arena
      TEMP_FOLDER: /tmp/arena_upload
      ANALYSIS_OUTPUT_DIR: /tmp/arena_analysis

  web:
    env_file:
      - ../../.env
    depends_on:
      - app_server
    ports:
      - "9880:80"
    build:
      context: ../..
      dockerfile: infra/web/Dockerfile
      target: arena-web
    environment:
      ARENA_HOST: app_server:9090
